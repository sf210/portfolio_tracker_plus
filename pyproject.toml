[project]
name = "portfolio-tracker-plus"
version = "0.1.0"
description = "Portfolio allocation tracker: fetch prices and build an HTML report"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
fetch-prices = "fetch_prices:main"
report = "report:main"
linked-accounts = "linked_accounts:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
